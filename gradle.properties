# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
# Point this at a real JDK 17 (Gradle can run on a newer JDK, but the mod toolchain needs 17).
org.gradle.java.home=E:\\program\\JAVA\\jei_filter\\tools\\jdk-17

# Mod
mod_id=jei_filter
mod_name=JEI Filter
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.jeifilter
mod_authors=jei_filter contributors
mod_description=A JEI addon that adds a hopper filter button next to JEI's search bar, letting you hide whole mods from JEI with whitelist (mod) or blacklist (mod) selection.

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# JEI (the mod we are an addon for)
# Compiled against the OLDEST JEI we intend to support, so that anything newer (the whole
# hideIngredients/unhideIngredients family, which only exists from 15.55.0) is reached through
# JeiVisibilityBridge's reflection instead of a hard link. Otherwise the mod dies with
# NoSuchMethodError on the many 1.20.1 packs still pinned to an older JEI.
jei_version=15.20.0.129
jei_version_range=[15.20.0,)

# Mixin
mixin_version=0.8.5
mixingradle_version=0.7.38

# Parchment (readable parameter names for development)
parchment_minecraft_version=1.20.1
parchment_version=2023.09.03
